<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
    .divider {
      height: 1px;
      background: #1e293b;
      margin: 16px 0;
    }
    .tip {
      font-size: 11px;
      color: #475569;
      line-height: 1.5;
    }
    .tip strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="logo">📸 ScanSync</div>
  <div class="sub">Phone → PC image transfer</div>

  <button class="btn" id="openApp">Open Dashboard</button>

  <div class="divider"></div>

  <div class="tip">
    <strong>How to use:</strong><br>
    1. Click above to open the PC dashboard<br>
    2. Click "Create Session" to get a QR code<br>
    3. Scan QR with your phone camera<br>
    4. Capture photos and hit Upload
  </div>

  <script src="popup.js"></script>
</body>
</html>
